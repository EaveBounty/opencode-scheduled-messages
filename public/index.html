<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Schedule messages to existing OpenCode V2 sessions. Write at peak, send off-peak, keep the thread." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="OC Schedule" />
    <title>OpenCode Scheduled Messages</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div id="app" class="app"></div>
    <div id="sheet-host"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <noscript>This app needs JavaScript. OpenCode Scheduled Messages is a local-first PWA.</noscript>
    <script type="module" src="/app.js"></script>
  </body>
</html>
